# Full stack offline for CI: MinIO instead of S3, fake parser, console email, Playwright runner.
#   docker compose -f docker/docker-compose.test.yml run --rm tests
name: vendor-portal-test

services:
  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_DB: vendor_portal, POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, APP_DB_USER: vp_app, APP_DB_PASSWORD: vp_app }
    volumes: [./postgres/init.sh:/docker-entrypoint-initdb.d/init.sh:ro]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U postgres"], interval: 5s, retries: 10 }

  redis:
    image: redis:7-alpine

  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    command: server /data
    environment: { MINIO_ROOT_USER: minio, MINIO_ROOT_PASSWORD: minio-secret }

  minio-init:
    image: minio/mc:RELEASE.2024-10-08T09-37-26Z
    depends_on: [minio]
    entrypoint: >
      sh -c "until mc alias set local http://minio:9000 minio minio-secret; do sleep 1; done && mc mb -p local/vendor-portal-test"

  tests:
    build: { context: .., dockerfile: docker/Dockerfile, target: test }
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
      minio-init: { condition: service_completed_successfully }
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DATABASE_URL: postgres://vp_app:vp_app@postgres:5432/vendor_portal
      REDIS_URL: redis://redis:6379/0
      PARSER_ENGINE: fake
      STORAGE_BACKEND: s3
      AWS_STORAGE_BUCKET_NAME: vendor-portal-test
      AWS_S3_SSE_KMS: "false"
      AWS_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: minio
      AWS_SECRET_ACCESS_KEY: minio-secret
      PLAYWRIGHT_CHROMIUM_EXECUTABLE: ""
    volumes: [../test-results:/app/test-results]
    command: >
      sh -c "pytest tests/unit -n auto -q &&
             pytest tests/e2e -n auto -q --tracing retain-on-failure --output test-results"
