worker_processes auto;
events { worker_connections 1024; }

http {
  include /etc/nginx/mime.types;
  sendfile on;
  server_tokens off;
  client_max_body_size 11m;          # 10 MB upload limit + form overhead
  gzip on;
  gzip_types text/css application/javascript application/json text/plain image/svg+xml;

  # Rate-limit only POSTs (credential / OTP attempts and uploads); page loads are not counted.
  map $request_method $post_client { POST $binary_remote_addr; default ""; }
  limit_req_zone $post_client zone=login:10m rate=10r/m;
  limit_req_zone $post_client zone=upload:10m rate=30r/m;
  limit_req_status 429;

  # Re-resolve the app container on every deploy (a static upstream caches the old container IP -> 502).
  resolver 127.0.0.11 valid=10s ipv6=off;

  server {
    listen 80;
    server_name _;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
  }

  server {
    listen 443 ssl;
    http2 on;
    server_name vendor.solfin.co.in vendor-uat.solfin.co.in;
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    set $django http://app:8000;

    # Security headers (HSTS, CSP, X-Frame-Options, nosniff) come from Django for app responses.
    location /static/ {
      alias /srv/static/; expires 7d; access_log off;
      add_header X-Content-Type-Options nosniff always;
      add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    location = /login/ { limit_req zone=login burst=5 nodelay; proxy_pass $django; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto https; }
    location /login/otp/ { limit_req zone=login burst=5 nodelay; proxy_pass $django; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto https; }
    location ~ ^/vendor/(invoices/upload|onboarding/documents/.*/upload)/ {
      limit_req zone=upload burst=10 nodelay;
      proxy_pass $django; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto https;
      proxy_read_timeout 120s;
    }
    location /flower/ { deny all; }   # Flower is internal only
    location / {
      proxy_pass $django;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_read_timeout 60s;
    }
  }
}
