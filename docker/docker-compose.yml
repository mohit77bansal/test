# Deliverable for Solfin-managed hosting: `docker compose -f docker/docker-compose.yml up -d`
# Configuration lives in ../.env (see .env.example). Postgres and Redis are reachable only inside this network.
name: vendor-portal

x-app: &app
  image: ${APP_IMAGE:-vendor-portal:latest}
  build: { context: .., dockerfile: docker/Dockerfile, target: base }
  env_file: ../.env
  restart: unless-stopped
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_started }
  networks: [internal]

services:
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - static:/srv/static:ro
      - ${TLS_CERT_DIR:-./nginx/certs}:/etc/nginx/certs:ro
      - certbot-www:/var/www/certbot:ro
    depends_on: [app]
    networks: [internal, public]

  app:
    <<: *app
    volumes: [static:/app/staticfiles]
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers ${GUNICORN_WORKERS:-4} --timeout 60 --access-logfile -

  worker:
    <<: *app
    command: celery -A config worker -l info --concurrency ${CELERY_CONCURRENCY:-4}

  beat:
    <<: *app
    command: celery -A config beat -l info --schedule /tmp/celerybeat-schedule

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes: [redis:/data]
    networks: [internal]

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vendor_portal}
      POSTGRES_USER: ${POSTGRES_SUPERUSER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?set in .env}
      APP_DB_USER: ${APP_DB_USER:-vp_app}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      retries: 5
    networks: [internal]

  clamav:
    image: clamav/clamav:1.4
    restart: unless-stopped
    volumes: [clamav:/var/lib/clamav]
    networks: [internal]

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: ../.env
    environment:
      PGHOST: postgres
    volumes: [./backup/backup.sh:/backup.sh:ro]
    entrypoint: ["/bin/sh", "/backup.sh"]
    depends_on: [postgres]
    networks: [internal, public]

volumes: { pgdata: {}, redis: {}, static: {}, clamav: {}, certbot-www: {} }

networks:
  internal: { internal: true }
  public: {}
