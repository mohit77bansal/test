name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DATABASE_URL: postgres://vp_app:vp_app@localhost:5432/vendor_portal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - name: Create app role and schema (non-superuser so RLS applies)
        run: |
          export PGPASSWORD=postgres
          psql -h localhost -U postgres -c "CREATE ROLE vp_app LOGIN PASSWORD 'vp_app' CREATEDB NOSUPERUSER NOBYPASSRLS"
          psql -h localhost -U postgres -c "CREATE DATABASE vendor_portal OWNER vp_app"
          psql -h localhost -U postgres -d vendor_portal -c "CREATE SCHEMA vp AUTHORIZATION vp_app"
          psql -h localhost -U postgres -d template1 -c "CREATE SCHEMA IF NOT EXISTS vp; GRANT ALL ON SCHEMA vp TO vp_app; GRANT ALL ON SCHEMA public TO vp_app"
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py permission_matrix --check
      - name: Unit tests
        run: pytest tests/unit -n auto -q
      - run: python -m playwright install --with-deps chromium
      - name: Playwright e2e
        run: pytest tests/e2e -n auto -q --tracing retain-on-failure --output test-results
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: playwright-traces, path: test-results, if-no-files-found: ignore }

  image:
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: base
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.ref_name }}
