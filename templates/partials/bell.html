<a href="{% url 'notify:bell' %}" class="relative rounded-md p-1 hover:bg-indigo-700" data-testid="bell" title="Notifications">
  <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.4-1.4A2 2 0 0118 14.2V11a6 6 0 10-12 0v3.2c0 .5-.2 1-.6 1.4L4 17h5m6 0a3 3 0 11-6 0"/></svg>
  {% if unread_count %}<span class="absolute -right-1 -top-1 rounded-full bg-red-500 px-1.5 text-xs text-white" data-testid="bell-count">{{ unread_count }}</span>{% endif %}
  <span class="sr-only">Notifications</span>
</a>
