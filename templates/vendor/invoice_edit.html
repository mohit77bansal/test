{% extends "base.html" %}{% block title %}Check invoice{% endblock %}
{% block content %}
<div class="mb-4 flex items-center justify-between">
  <div><h1 class="h1">Check and submit your invoice</h1><p class="muted">File: <a class="text-indigo-700 underline" href="{% url 'vendor:file' invoice.file.pk %}" target="_blank">{{ invoice.file.original_name }}</a></p></div>
  <form method="post" action="{% url 'vendor:invoice_discard' invoice.pk %}" data-confirm="Discard this draft?">{% csrf_token %}<button class="btn btn-sm" data-testid="invoice-discard-btn">Discard</button></form>
</div>
{% include "partials/invoice_parse.html" %}
{% endblock %}
