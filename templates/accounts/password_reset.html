{% extends "accounts/_auth_base.html" %}{% block title %}Reset password{% endblock %}
{% block card %}
<h1 class="h1 mb-4">Reset your password</h1>
<form method="post" class="space-y-4">{% csrf_token %}
  <div><label class="label" for="id_email">Email</label><input class="input" type="email" name="email" id="id_email" required data-testid="reset-email"></div>
  <button class="btn btn-primary w-full justify-center" data-testid="reset-submit-btn">Send reset link</button>
</form>
{% endblock %}
